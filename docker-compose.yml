
services:
  postgres:
    image: postgres:16
    container_name: certiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow_dev
      POSTGRES_DB: certiflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow -d certiflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
